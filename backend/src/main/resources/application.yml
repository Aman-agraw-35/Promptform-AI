server:
  port: 8080
spring:
  application:
    name: promptform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/promptform}
    username: ${DATABASE_USERNAME:promptform}
    password: ${DATABASE_PASSWORD:promptform}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false
      url: ${REDIS_URL:redis://localhost:6379}
management:
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
promptform:
  redis:
    enabled: ${REDIS_ENABLED:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:20}
  prompt-cache:
    enabled: ${PROMPT_CACHE_ENABLED:true}
    max-entries: ${PROMPT_CACHE_MAX_ENTRIES:500}
    ttl-seconds: ${PROMPT_CACHE_TTL_SECONDS:900}
  llm:
    provider: ${PROMPTFORM_LLM_PROVIDER:demo}
    gemini-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
    cost-per-million-tokens: ${GEMINI_COST_PER_MILLION_TOKENS:0}
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
