services:
  - type: web
    name: promptform-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PROMPTFORM_LLM_PROVIDER
        value: gemini
      - key: REDIS_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
