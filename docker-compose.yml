services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promptform
      POSTGRES_USER: promptform
      POSTGRES_PASSWORD: promptform
    ports:
      - "5432:5432"
    volumes:
      - promptform-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  promptform-postgres:
